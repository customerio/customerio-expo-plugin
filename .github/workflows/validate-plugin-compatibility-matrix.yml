name: Validate Plugin Compatibility Matrix

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out and validate against. Defaults to the calling workflow''s ref.'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  XCODE_VERSION: "26.5"
  APP_DIR: ci-test-apps
  APP_NAME_PREFIX: ExpoPluginTestApp

jobs:
  validate:
    name: Expo ${{ matrix.expo-version }} - ${{ matrix.platform }}${{ matrix.ios-push-provider && format(' ({0})', matrix.ios-push-provider) }}
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - expo-version: 54
            platform: android
            runs-on: ubuntu-latest
          - expo-version: 54
            platform: ios
            runs-on: macos-26
            ios-push-provider: apn
          - expo-version: 54
            platform: ios
            runs-on: macos-26
            ios-push-provider: fcm

          # Running on latest version helps to catch issues early for new versions not listed above
          - expo-version: latest
            platform: android
            runs-on: ubuntu-latest
          - expo-version: latest
            platform: ios
            runs-on: macos-26
            ios-push-provider: apn
          - expo-version: latest
            platform: ios
            runs-on: macos-26
            ios-push-provider: fcm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup iOS
        if: matrix.platform == 'ios'
        uses: customerio/mobile-ci-tools/github-actions/ios/setup-ios/v1@main
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      - name: Set APP_NAME and APP_PATH
        run: |
          echo "APP_NAME=${{ env.APP_NAME_PREFIX }}_${{ matrix.expo-version }}" >> $GITHUB_ENV
          echo "APP_PATH=${{ env.APP_DIR }}/${{ env.APP_NAME_PREFIX }}_${{ matrix.expo-version }}" >> $GITHUB_ENV

      # The test app is generated fresh by `compatibility:create-test-app`, so
      # `Podfile.lock` / Gradle files don't exist at checkout. The cache keys
      # below pin to the inputs that determine resolved versions: Expo SDK,
      # Xcode, push provider, and the plugin's own lockfile.
      - name: Cache CocoaPods
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ matrix.expo-version }}-${{ matrix.ios-push-provider }}-${{ env.XCODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-${{ matrix.expo-version }}-${{ matrix.ios-push-provider }}-${{ env.XCODE_VERSION }}-
            ${{ runner.os }}-pods-${{ matrix.expo-version }}-${{ matrix.ios-push-provider }}-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.expo-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.expo-version }}-

      - name: Create Test App
        run: |
          npm run compatibility:create-test-app -- \
            --expo-version=${{ matrix.expo-version }} \
            --app-name=${{ env.APP_NAME }} \
            --dir-name=${{ env.APP_DIR }}

      - name: Setup Test App
        run: |
          npm run compatibility:setup-test-app -- \
            --app-path=${{ env.APP_PATH }}

      - name: Configure Plugin with Default Config
        run: |
          npm run compatibility:configure-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --add-default-config

      - name: Validate Plugin
        run: |
          npm run compatibility:validate-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --expo-version=${{ matrix.expo-version }} \
            --platforms=${{ matrix.platform }}\
            --ios-use-frameworks="static" \
            ${{ matrix.ios-push-provider && format(' --ios-push-providers={0}', matrix.ios-push-provider) }}
