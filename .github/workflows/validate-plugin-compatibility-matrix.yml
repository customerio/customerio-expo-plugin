name: Validate Plugin Compatibility Matrix

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out and validate against. Defaults to the calling workflow''s ref.'
        type: string
        required: false
      matrix:
        description: 'JSON matrix. Defaults to the complete supported-version and latest-version matrix.'
        type: string
        required: false
        default: '[{"expo-version":54,"platform":"android","runs-on":"ubuntu-latest"},{"expo-version":54,"platform":"ios","runs-on":"macos-26","ios-push-provider":"apn"},{"expo-version":54,"platform":"ios","runs-on":"macos-26","ios-push-provider":"fcm"},{"expo-version":"latest","platform":"android","runs-on":"ubuntu-latest"},{"expo-version":"latest","platform":"ios","runs-on":"xcode-27","xcode-version":"27.0","launch-ios-major":27,"ios-push-provider":"apn"},{"expo-version":"latest","platform":"ios","runs-on":"xcode-27","xcode-version":"27.0","launch-ios-major":27,"ios-push-provider":"fcm"}]'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  # Xcode for iOS rows that do not set `xcode-version` (SDK 54-57 hosts).
  XCODE_VERSION: "26.6"
  APP_DIR: ci-test-apps
  APP_NAME_PREFIX: ExpoPluginTestApp

jobs:
  validate:
    name: Expo ${{ matrix.expo-version }} - ${{ matrix.platform }}${{ matrix.ios-push-provider && format(' ({0})', matrix.ios-push-provider) }}
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup iOS
        if: matrix.platform == 'ios'
        uses: customerio/mobile-ci-tools/github-actions/ios/setup-ios/v1@main
        with:
          xcode-version: ${{ matrix.xcode-version || env.XCODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      - name: Set APP_NAME and APP_PATH
        run: |
          echo "APP_NAME=${{ env.APP_NAME_PREFIX }}_${{ matrix.expo-version }}" >> "$GITHUB_ENV"
          echo "APP_PATH=${{ env.APP_DIR }}/${{ env.APP_NAME_PREFIX }}_${{ matrix.expo-version }}" >> "$GITHUB_ENV"

      # The test app is generated fresh by `compatibility:create-test-app`, so
      # `Podfile.lock` / Gradle files don't exist at checkout. The cache keys
      # below pin to the inputs that determine resolved versions: Expo SDK,
      # Xcode, push provider, and the plugin's own lockfile.
      - name: Cache CocoaPods
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ matrix.expo-version }}-${{ matrix.ios-push-provider }}-${{ matrix.xcode-version || env.XCODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-${{ matrix.expo-version }}-${{ matrix.ios-push-provider }}-${{ matrix.xcode-version || env.XCODE_VERSION }}-
            ${{ runner.os }}-pods-${{ matrix.expo-version }}-${{ matrix.ios-push-provider }}-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.expo-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.expo-version }}-

      - name: Create Test App
        run: |
          npm run compatibility:create-test-app -- \
            --expo-version=${{ matrix.expo-version }} \
            --app-name=${{ env.APP_NAME }} \
            --dir-name=${{ env.APP_DIR }}

      - name: Setup Test App
        run: |
          npm run compatibility:setup-test-app -- \
            --app-path=${{ env.APP_PATH }}

      - name: Configure Plugin with Default Config
        run: |
          npm run compatibility:configure-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --add-default-config

      - name: Validate Plugin
        run: |
          date +%s > "$RUNNER_TEMP/build-start-epoch"
          npm run compatibility:validate-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --expo-version=${{ matrix.expo-version }} \
            --platforms=${{ matrix.platform }}\
            --ios-use-frameworks="static" \
            ${{ matrix.ios-push-provider && format(' --ios-push-providers={0}', matrix.ios-push-provider) }}

      # Expo SDK 58+ generates a UIScene host, built here with the iOS 27 SDK. A
      # build can pass while the app still terminates at launch, so these rows
      # also install and launch it. SDK 54-57 hosts have no UIScene and cannot
      # launch on the iOS 27 SDK; they stay on Xcode 26 (`XCODE_VERSION`).
      # The launch check comes from this workflow's revision, not from
      # `inputs.ref`, so a manual run against a ref that predates it still runs it.
      - name: Check out the launch check
        if: matrix.launch-ios-major
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-launch-check
          sparse-checkout: |
            .github/actions
            scripts/compatibility

      - name: Launch generated iOS app
        if: matrix.launch-ios-major
        uses: ./.ci-launch-check/.github/actions/launch-generated-ios-app
        with:
          app-path: ${{ env.APP_PATH }}
          build-start-epoch-file: ${{ runner.temp }}/build-start-epoch
          expected-ios-major: ${{ matrix.launch-ios-major }}
          log-path: ${{ runner.temp }}/launch.log
          settings-json-path: ${{ runner.temp }}/build-settings.json

      - name: Upload launch logs
        if: failure() && matrix.launch-ios-major
        uses: actions/upload-artifact@v4
        with:
          name: launch-logs-expo-${{ matrix.expo-version }}-${{ matrix.ios-push-provider }}
          path: |
            ${{ runner.temp }}/launch.log
            ${{ runner.temp }}/build-settings.json
          if-no-files-found: ignore
          retention-days: 7
