name: Deploy SDK

# Chained off the release-gating compatibility matrix via `workflow_run`.
# We only deploy when:
#   1. The matrix completed successfully, AND
#   2. It was triggered by a `push` (defends against any future change that
#      accidentally adds a `workflow_dispatch` trigger to the release matrix —
#      a manually-dispatched run would not satisfy `event == 'push'`), AND
#   3. The push targeted `main` (the only branch in `.releaserc.json`).
#
# `workflow_dispatch` here is publish-only: it publishes an existing tag, never tags or
# re-releases, and reaches only `publish-npm-manual` — the gates above still hold.
on:
  workflow_run:
    workflows: ["Validate Plugin Compatibility Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish to npm (e.g. 3.7.2)'
        required: true
        type: string

permissions:
  id-token: write
  contents: write # access to push the git tag
  issues: write # Bot creates an issue if there is an issue during deployment process
  pull-requests: write # allow bot to make comments on PRs after they get deployed

jobs:
  deploy-git-tag:
    name: Deploy git tag
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      new_release_git_head: ${{ steps.semantic-release.outputs.new_release_git_head }}
      new_release_published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:

      - name: 'Generate token'
        id: generate_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.CIO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CIO_APP_SECRET }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          # Operate on the exact commit the matrix validated, not the latest
          # main HEAD which could have advanced while the matrix was running.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy git tag via semantic release
        uses: cycjimmy/semantic-release-action@0a51e81a6baff2acad3ee88f4121c589c73d0f0e # v4.2.0
        id: semantic-release        
        with:
          # Both pinned deliberately. The conventionalcommits 10.x line renders through
          # @conventional-changelog/template, which needs conventional-changelog-writer@9;
          # every released semantic-release resolves writer@8, so 10.x cannot render here.
          semantic_version: 25.0.9
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.3.1
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/github
            @semantic-release/exec
        env:
          # Needs to push git commits to repo. Needs write access.
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Notify team of git tag being created
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        if: steps.semantic-release.outputs.new_release_published == 'true' # only run if a git tag was made.
        with:
          # Use block kit to format the Slack message: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "Expo plugin git tag created",
              "username": "Expo deployment bot",
              "icon_url": "https://logos-download.com/wp-content/uploads/2021/01/Expo_Logo.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Expo* plugin git tag created successfully! (deployment step 1 of 2)"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version ${{ steps.semantic-release.outputs.new_release_version }}*\n\nExpo plugin deployment progress:\n ~1. <https://github.com/${{github.repository}}/releases/tag/${{steps.semantic-release.outputs.new_release_version}}|create git tag>~\n2. deploy to npm\n\n"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify team of failure
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        if: ${{ failure() }} # only run this if any previous step failed
        with:
          # Use block kit to format the Slack message: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "Expo plugin deployment failure",
              "username": "Expo deployment bot",
              "icon_url": "https://logos-download.com/wp-content/uploads/2021/01/Expo_Logo.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Expo* plugin deployment :warning: failure :warning:"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Expo plugin failed deployment during step *create git tag*. View <https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|CI server logs> to learn why and fix the issue. <https://github.com/customerio/mobile/blob/main/GIT-WORKFLOW.md|Learn more about the deployment process and how to fix errors>."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy-npm:
    name: Deploy to npm
    needs: [deploy-git-tag]
    # Belt-and-suspenders: the `needs:` already guarantees deploy-git-tag ran,
    # which itself was gated on success+push+main. Re-stating the workflow_run
    # checks here means even if the gate on deploy-git-tag is ever loosened,
    # the npm publish stays guarded.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.deploy-git-tag.outputs.new_release_published == 'true'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the semantic-release-produced commit (which is built on top of
          # the workflow_run head_sha that deploy-git-tag started from).
          ref: ${{ needs.deploy-git-tag.outputs.new_release_git_head }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Pinned to the 11.x line rather than @latest. OIDC needs >= 11.5.1, which 11.x satisfies.
      # Node 24 no longer caps us at 11.x the way node 20 did, but the npm that node 24 bundles
      # varies by patch release and is not guaranteed to clear 11.5.1 — so keep publishing on an
      # explicit pin rather than on whatever npm the runner happens to ship.
      # Raise this deliberately, not by drifting with @latest.
      - name: Install npm 11.5.1+ for OIDC support
        run: npm install -g npm@11

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile TypeScript
        run: yarn typescript

      - name: Publish to npm
        run: npm publish

      - name: Notify team of successful deployment
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        if: ${{ success() }}
        with:
          # Use block kit to format the Slack message: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "Expo plugin deployed to npm",
              "username": "Expo deployment bot",
              "icon_url": "https://logos-download.com/wp-content/uploads/2021/01/Expo_Logo.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Expo* plugin deployed to npm! (deployment step 2 of 2)"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version ${{ needs.deploy-git-tag.outputs.new_release_version }}*\n\nExpo plugin deployment progress:\n ~1. <https://github.com/${{github.repository}}/releases/tag/${{ needs.deploy-git-tag.outputs.new_release_version }}|create git tag>~\n~2. deploy to npm~\n\n"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify team of failure
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        if: ${{ failure() }} # only run this if any previous step failed
        with:
          # Use block kit to format the Slack message: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "Expo plugin deployment failure",
              "username": "Expo deployment bot",
              "icon_url": "https://logos-download.com/wp-content/uploads/2021/01/Expo_Logo.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Expo* plugin deployment :warning: failure :warning:"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Expo plugin failed deployment during step *deploy to npm*. View <https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|CI server logs> to learn why and fix the issue. <https://github.com/customerio/mobile/blob/main/GIT-WORKFLOW.md|Learn more about the deployment process and how to fix errors>."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # Same file and `release` environment as deploy-npm, so npm OIDC still applies. The
  # automated jobs gate on workflow_run.*, which is null here, so they skip on a dispatch.
  publish-npm-manual:
    name: Publish existing tag to npm (manual recovery)
    if: github.event_name == 'workflow_dispatch'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11.5.1+ for OIDC support
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # npm forbids republishing a version, so check the tag before anything is published.
      - name: Verify package version matches tag
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "$pkg_version" != "$EXPECTED_TAG" ]]; then
            echo "::error::package.json version ($pkg_version) does not match requested tag ($EXPECTED_TAG)."
            exit 1
          fi
          echo "package.json version matches tag: $pkg_version"

      - name: Publish to npm
        run: npm publish

  publish-sample-apps-public-builds:
    needs: deploy-npm
    uses: ./.github/workflows/build-sample-app-for-sdk-release.yml
    secrets: inherit
