name: Xcode 27 preview compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/ios-toolchain-compatibility.yml'
      - 'scripts/compatibility/resolve_simulator_app.py'
  schedule:
    # Native and Flutter run during the two preceding hours.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scheduled and manual runs for main share one slot. Pull-request runs use
  # their merge ref, so they do not cancel the nightly.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  LAUNCH_SURVIVAL_SECONDS: '10'
  APP_DIR: ci-test-apps
  APP_NAME_PREFIX: ExpoPluginTestApp
  EXPO_CANARY_VERSION: 58.0.0-canary-20260812-27f94d4

jobs:
  preview:
    name: Xcode 27 preview (${{ matrix.ios-push-provider }})
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ios-push-provider:
          - apn
          - fcm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Report and verify iOS toolchain family
        id: toolchain
        uses: customerio/mobile-ci-tools/github-actions/ios/report-toolchain/v1@main
        with:
          expected-xcode-major: '27'
          expected-ios-sdk-major: '27'

      - name: Install Dependencies
        run: npm ci

      - name: Set APP_NAME and APP_PATH
        run: |
          echo "APP_NAME=${{ env.APP_NAME_PREFIX }}_scene_canary" >> "$GITHUB_ENV"
          echo "APP_PATH=${{ env.APP_DIR }}/${{ env.APP_NAME_PREFIX }}_scene_canary" >> "$GITHUB_ENV"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-xcode-27-preview-${{ matrix.ios-push-provider }}-${{ steps.toolchain.outputs.xcode-build }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-xcode-27-preview-${{ matrix.ios-push-provider }}-

      - name: Create Test App
        run: |
          mkdir -p "$APP_DIR"
          npx create-expo-app "$APP_PATH" \
            --template "expo-template-default@$EXPO_CANARY_VERSION" \
            --no-install
          npm pkg set \
            --prefix "$APP_PATH" \
            "dependencies.expo=$EXPO_CANARY_VERSION"
          npm install --prefix "$APP_PATH"

      - name: Setup Test App
        run: |
          npm_config_foreground_scripts=true npm run compatibility:setup-test-app -- \
            --app-path=${{ env.APP_PATH }}

      - name: Complete FCM fixture metadata
        if: matrix.ios-push-provider == 'fcm'
        run: |
          /usr/libexec/PlistBuddy \
            -c 'Add :PROJECT_ID string test-project' \
            "$APP_PATH/cio-artifacts/GoogleService-Info.plist"

      - name: Configure Plugin with Default Config
        run: |
          npm run compatibility:configure-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --add-default-config

      - name: Configure push provider
        run: |
          npm run compatibility:configure-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --ios-push-provider=${{ matrix.ios-push-provider }} \
            --ios-use-frameworks=static

      - name: Generate scene-enabled native project
        working-directory: ${{ env.APP_PATH }}
        run: |
          CI=1 npx expo prebuild \
            --clean \
            --platform=ios \
            --template "expo-template-bare-minimum@$EXPO_CANARY_VERSION"
          workspaces=(ios/*.xcworkspace)
          if [[ "${#workspaces[@]}" -ne 1 ]]; then
            echo "::error::expected one generated workspace, found ${#workspaces[@]}"
            exit 1
          fi
          echo "IOS_APP_NAME=$(basename "${workspaces[0]}" .xcworkspace)" >> "$GITHUB_ENV"

      - name: Validate generated plugin configuration
        run: |
          TEST_APP_PATH="$APP_PATH" \
          TEST_APP_NAME="$IOS_APP_NAME" \
          EXPO_VERSION="$EXPO_CANARY_VERSION" \
            npm test -- \
              __tests__/ios/common \
              "__tests__/ios/${{ matrix.ios-push-provider }}"

      - name: Build generated app
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          date +%s > "$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-start-epoch"
          workspaces=("$APP_PATH"/ios/*.xcworkspace)
          if [[ "${#workspaces[@]}" -ne 1 ]]; then
            echo "::error::expected one generated workspace, found ${#workspaces[@]}"
            exit 1
          fi
          workspace="${workspaces[0]}"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -sdk iphonesimulator \
            -configuration Release \
            build

      - name: Resolve generated simulator app
        shell: bash
        run: |
          set -euo pipefail
          settings_json="$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-settings.json"
          private_settings_json="$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-settings-private.json"
          trap 'rm -f "$private_settings_json"' EXIT
          build_start_epoch="$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-start-epoch"
          shopt -s nullglob
          workspaces=("$APP_PATH"/ios/*.xcworkspace)
          if [[ "${#workspaces[@]}" -ne 1 ]]; then
            echo "::error::expected one generated workspace, found ${#workspaces[@]}: ${workspaces[*]-}"
            exit 1
          fi
          workspace="${workspaces[0]}"
          scheme="$(basename "$workspace" .xcworkspace)"
          set +e
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -showBuildSettings \
            -json > "$private_settings_json"
          xcodebuild_status="$?"
          set -e
          if [[ "$xcodebuild_status" -ne 0 ]]; then
            # Preserve only the resolver's bounded parse metadata. The private
            # build settings are still removed by the EXIT trap.
            python3 scripts/compatibility/resolve_simulator_app.py \
              --private-settings-json "$private_settings_json" \
              --build-start-epoch "$build_start_epoch" \
              --scheme "$scheme" \
              --sanitized-settings-json "$settings_json" >/dev/null || true
            echo "::error::xcodebuild -showBuildSettings failed with exit code $xcodebuild_status"
            exit "$xcodebuild_status"
          fi
          app_product_path="$(python3 scripts/compatibility/resolve_simulator_app.py \
            --private-settings-json "$private_settings_json" \
            --build-start-epoch "$build_start_epoch" \
            --scheme "$scheme" \
            --sanitized-settings-json "$settings_json")"
          if [[ -z "$app_product_path" || "$app_product_path" == *$'\n'* ]]; then
            echo '::error::resolved app product path must be one non-empty line'
            exit 1
          fi
          echo "APP_PRODUCT_PATH=$app_product_path" >> "$GITHUB_ENV"

      - name: Install and launch generated app
        uses: customerio/mobile-ci-tools/github-actions/ios/launch-simulator-app/v1@main
        with:
          app-path: ${{ env.APP_PRODUCT_PATH }}
          expected-ios-major: '27'
          survival-seconds: ${{ env.LAUNCH_SURVIVAL_SECONDS }}
          log-path: ${{ runner.temp }}/${{ matrix.ios-push-provider }}-launch.log

      - name: Collect crash reports
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          reports_dir="$RUNNER_TEMP/${{ matrix.ios-push-provider }}-crash-reports"
          mkdir -p "$reports_dir"
          find "$HOME/Library/Logs/DiagnosticReports" \
            -maxdepth 1 \
            -type f \
            -name "${IOS_APP_NAME}*" \
            -exec cp {} "$reports_dir" \; 2>/dev/null || true
          if [[ -z "$(find "$reports_dir" -type f -print -quit)" ]]; then
            printf 'No host crash report was generated. See the launch log.\n' \
              > "$reports_dir/README.txt"
          fi

      - name: Upload compatibility logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-27-preview-expo-${{ matrix.ios-push-provider }}-logs
          path: |
            ${{ runner.temp }}/${{ matrix.ios-push-provider }}-launch.log
            ${{ runner.temp }}/${{ matrix.ios-push-provider }}-build-settings.json
            ${{ runner.temp }}/${{ matrix.ios-push-provider }}-build-start-epoch
            ${{ runner.temp }}/${{ matrix.ios-push-provider }}-crash-reports
          if-no-files-found: error
          retention-days: 7
