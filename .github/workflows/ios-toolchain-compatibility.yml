name: Xcode 27 preview compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/ios-toolchain-compatibility.yml'
  schedule:
    # Native and Flutter run during the two preceding hours.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  LAUNCH_SURVIVAL_SECONDS: '10'
  APP_DIR: ci-test-apps
  APP_NAME_PREFIX: ExpoPluginTestApp

jobs:
  preview:
    name: Xcode 27 preview (${{ matrix.ios-push-provider }})
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ios-push-provider:
          - apn
          - fcm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Report and verify iOS toolchain family
        id: toolchain
        uses: customerio/mobile-ci-tools/github-actions/ios/report-toolchain/v1@main
        with:
          expected-xcode-major: '27'
          expected-ios-sdk-major: '27'

      - name: Install Dependencies
        run: npm ci

      - name: Set APP_NAME and APP_PATH
        run: |
          echo "APP_NAME=${{ env.APP_NAME_PREFIX }}_latest" >> "$GITHUB_ENV"
          echo "APP_PATH=${{ env.APP_DIR }}/${{ env.APP_NAME_PREFIX }}_latest" >> "$GITHUB_ENV"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-xcode-27-preview-${{ matrix.ios-push-provider }}-${{ steps.toolchain.outputs.xcode-build }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-xcode-27-preview-${{ matrix.ios-push-provider }}-

      - name: Create Test App
        run: |
          npm run compatibility:create-test-app -- \
            --expo-version=latest \
            --app-name=${{ env.APP_NAME }} \
            --dir-name=${{ env.APP_DIR }} \
            --clean

      - name: Setup Test App
        run: |
          npm run compatibility:setup-test-app -- \
            --app-path=${{ env.APP_PATH }}

      - name: Configure Plugin with Default Config
        run: |
          npm run compatibility:configure-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --add-default-config

      - name: Validate Plugin
        id: validate-plugin
        run: |
          date +%s > "$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-start-epoch"
          npm run compatibility:validate-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --expo-version=latest \
            --platforms=ios \
            --ios-use-frameworks="static" \
            --ios-push-providers=${{ matrix.ios-push-provider }}

      - name: Resolve generated simulator app
        id: resolve-app
        shell: bash
        run: |
          set -euo pipefail
          settings_json="$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-settings.json"
          private_settings_json="$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-settings-private.json"
          trap 'rm -f "$private_settings_json"' EXIT
          build_start_epoch="$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-start-epoch"
          shopt -s nullglob
          workspaces=("$APP_PATH"/ios/*.xcworkspace)
          if [[ "${#workspaces[@]}" -ne 1 ]]; then
            echo "::error::expected one generated workspace, found ${#workspaces[@]}: ${workspaces[*]-}"
            exit 1
          fi
          workspace="${workspaces[0]}"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -showBuildSettings \
            -json > "$private_settings_json"
          app_product_path="$(python3 scripts/compatibility/resolve_simulator_app.py \
            --private-settings-json "$private_settings_json" \
            --build-start-epoch "$build_start_epoch" \
            --scheme "$scheme" \
            --sanitized-settings-json "$settings_json")"
          if [[ -z "$app_product_path" || "$app_product_path" == *$'\n'* ]]; then
            echo '::error::resolved app product path must be one non-empty line'
            exit 1
          fi
          echo "APP_PRODUCT_PATH=$app_product_path" >> "$GITHUB_ENV"

      - name: Install and launch generated app
        id: launch
        # TODO(MBL-2248): switch to @main after customerio/mobile-ci-tools#16 merges.
        uses: customerio/mobile-ci-tools/github-actions/ios/launch-simulator-app/v1@c68e6b8f077a76525a989f46afc761c2f63c5e50
        with:
          app-path: ${{ env.APP_PRODUCT_PATH }}
          expected-ios-major: '27'
          survival-seconds: ${{ env.LAUNCH_SURVIVAL_SECONDS }}
          log-path: ${{ runner.temp }}/${{ matrix.ios-push-provider }}-launch.log

      - name: Record compatibility result
        if: steps.launch.outcome == 'success'
        shell: bash
        env:
          XCODE_VERSION: ${{ steps.toolchain.outputs.xcode-version }}
          XCODE_BUILD: ${{ steps.toolchain.outputs.xcode-build }}
          IOS_SIMULATOR_SDK: ${{ steps.toolchain.outputs.iphonesimulator-sdk }}
        run: |
          set -euo pipefail
          {
            echo '## Expo Xcode 27 preview compatibility'
            echo
            echo '**Classification:** launch-passed'
            echo "**Provider:** ${{ matrix.ios-push-provider }}"
            echo "**Toolchain:** Xcode ${XCODE_VERSION:-unknown} build ${XCODE_BUILD:-unknown}, iphonesimulator ${IOS_SIMULATOR_SDK:-unknown}"
            echo "**Scope:** generated-project compile, simulator install, launch, and ${LAUNCH_SURVIVAL_SECONDS}-second process survival; no callback, push-delivery, signing, or App Store claim"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record launch failure
        if: failure() && steps.launch.outcome == 'failure'
        shell: bash
        env:
          FAILURE_REASON: ${{ steps.launch.outputs.failure-reason }}
          XCODE_VERSION: ${{ steps.toolchain.outputs.xcode-version }}
          XCODE_BUILD: ${{ steps.toolchain.outputs.xcode-build }}
          IOS_SIMULATOR_SDK: ${{ steps.toolchain.outputs.iphonesimulator-sdk }}
        run: |
          set -euo pipefail
          case "$FAILURE_REASON" in
            runtime-unavailable|runtime-selection-failed|simulator-boot-failed)
              classification=simulator-infrastructure-unavailable
              next_step='inspect the hosted image runtime and launch log before attributing this to Expo'
              ;;
            install-failed)
              classification=generated-app-install-failed
              next_step='inspect the generated app and simulator install failure before evaluating lifecycle compatibility'
              ;;
            launch-failed)
              classification=generated-app-launch-failed
              next_step='inspect the launch log for the UIKit runtime issue or launch rejection'
              ;;
            did-not-survive)
              classification=generated-app-exited-early
              next_step='inspect the launch log for the UIKit runtime issue or early process exit'
              ;;
            invalid-input|invalid-app|sdk-mismatch)
              classification=launch-contract-invalid
              next_step='inspect the generated product metadata and smoke-test inputs'
              ;;
            *)
              echo "::warning::unrecognized launch failure reason: $FAILURE_REASON"
              classification=launch-smoke-failed
              next_step='confirm the simulator runtime and shared action reference before treating this as an Expo lifecycle failure'
              ;;
          esac
          {
            echo '## Expo Xcode 27 preview compatibility'
            echo
            echo "**Classification:** $classification"
            echo "**Failure category:** $FAILURE_REASON"
            echo "**Provider:** ${{ matrix.ios-push-provider }}"
            echo "**Toolchain:** Xcode ${XCODE_VERSION:-unknown} build ${XCODE_BUILD:-unknown}, iphonesimulator ${IOS_SIMULATOR_SDK:-unknown}"
            echo "**Next step:** $next_step"
            # Markdown backticks are intentionally literal in the summary.
            # shellcheck disable=SC2016
            echo '**Known boundary:** `generated-app-exited-early` is the expected blocker until Expo adopts UIScene; see [.github/IOS-TOOLCHAIN-COMPATIBILITY.md](https://github.com/customerio/customerio-expo-plugin/blob/main/.github/IOS-TOOLCHAIN-COMPATIBILITY.md).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record generated-app build failure
        if: failure() && steps.validate-plugin.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Expo Xcode 27 preview compatibility'
            echo
            echo '**Classification:** generated-app-build-failed'
            echo "**Provider:** ${{ matrix.ios-push-provider }}"
            echo '**Next step:** inspect prebuild, provider snapshots, CocoaPods, and xcodebuild output before evaluating launch compatibility'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record product resolution failure
        if: failure() && steps.resolve-app.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Expo Xcode 27 preview compatibility'
            echo
            echo '**Classification:** generated-app-resolution-failed'
            echo "**Provider:** ${{ matrix.ios-push-provider }}"
            echo '**Next step:** inspect the resolve-step log and, when present, the sanitized xcodebuild settings JSON before evaluating launch compatibility'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record unavailable toolchain
        if: failure() && steps.toolchain.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '## Expo Xcode 27 preview compatibility'
            echo
            echo '**Classification:** toolchain-unavailable'
            echo "**Provider:** ${{ matrix.ios-push-provider }}"
            echo '**Next step:** inspect the hosted Xcode 27 image and shared toolchain report before attributing this to Expo'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record unclassified failure
        if: failure() && steps.toolchain.outcome != 'failure' && steps.validate-plugin.outcome != 'failure' && steps.resolve-app.outcome != 'failure' && steps.launch.outcome != 'failure' && steps.launch.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Expo Xcode 27 preview compatibility'
            echo
            echo '**Classification:** harness-failed-before-build'
            echo "**Provider:** ${{ matrix.ios-push-provider }}"
            echo '**Next step:** inspect runner setup, npm install, app generation, and plugin configuration; no compatibility signal was produced'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-27-preview-expo-${{ matrix.ios-push-provider }}-logs
          path: |
            ${{ runner.temp }}/${{ matrix.ios-push-provider }}-launch.log
            ${{ runner.temp }}/${{ matrix.ios-push-provider }}-build-settings.json
            ${{ runner.temp }}/${{ matrix.ios-push-provider }}-build-start-epoch
          if-no-files-found: ignore
          retention-days: 7
