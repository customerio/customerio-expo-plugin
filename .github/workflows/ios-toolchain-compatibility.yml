name: Xcode 27 preview compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/ios-toolchain-compatibility.yml'
      - 'scripts/compatibility/resolve_simulator_app.py'
  schedule:
    # Native and Flutter run during the two preceding hours.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scheduled and manual runs for main share one slot. Pull-request runs use
  # their merge ref, so they do not cancel the nightly.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  LAUNCH_SURVIVAL_SECONDS: '10'
  APP_DIR: ci-test-apps
  APP_NAME_PREFIX: ExpoPluginTestApp

jobs:
  preview:
    name: Xcode 27 preview (Expo ${{ matrix.expo-version }}, ${{ matrix.ios-push-provider }})
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Expo SDK 58+ generates a UIScene host, which the iOS 27 SDK requires.
          # These apps must launch and survive like any other compatibility check.
          - expo-version: latest
            ios-push-provider: apn
            expectation: launch
          - expo-version: latest
            ios-push-provider: fcm
            expectation: launch
          # SDK 57 is the newest supported host without a UIScene manifest. Its
          # generated app cannot launch on the iOS 27 SDK; assert that known
          # failure while SDK 53-57 hosts are supported. The failure does not
          # depend on the push provider, so one provider is enough.
          - expo-version: 57
            ios-push-provider: apn
            expectation: uiscene-failure

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Report and verify iOS toolchain family
        id: toolchain
        uses: customerio/mobile-ci-tools/github-actions/ios/report-toolchain/v1@main
        with:
          expected-xcode-major: '27'
          expected-ios-sdk-major: '27'

      - name: Install Dependencies
        run: npm ci

      - name: Set APP_NAME and APP_PATH
        run: |
          echo "APP_NAME=${{ env.APP_NAME_PREFIX }}_${{ matrix.expo-version }}" >> "$GITHUB_ENV"
          echo "APP_PATH=${{ env.APP_DIR }}/${{ env.APP_NAME_PREFIX }}_${{ matrix.expo-version }}" >> "$GITHUB_ENV"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-xcode-27-preview-${{ matrix.expo-version }}-${{ matrix.ios-push-provider }}-${{ steps.toolchain.outputs.xcode-build }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-xcode-27-preview-${{ matrix.expo-version }}-${{ matrix.ios-push-provider }}-

      - name: Create Test App
        run: |
          npm run compatibility:create-test-app -- \
            --expo-version=${{ matrix.expo-version }} \
            --app-name=${{ env.APP_NAME }} \
            --dir-name=${{ env.APP_DIR }} \
            --clean

      - name: Setup Test App
        run: |
          npm run compatibility:setup-test-app -- \
            --app-path=${{ env.APP_PATH }}

      - name: Configure Plugin with Default Config
        run: |
          npm run compatibility:configure-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --add-default-config

      - name: Validate Plugin
        run: |
          date +%s > "$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-start-epoch"
          npm run compatibility:validate-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --expo-version=${{ matrix.expo-version }} \
            --platforms=ios \
            --ios-use-frameworks="static" \
            --ios-push-providers=${{ matrix.ios-push-provider }}

      - name: Resolve generated simulator app
        shell: bash
        run: |
          set -euo pipefail
          settings_json="$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-settings.json"
          private_settings_json="$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-settings-private.json"
          trap 'rm -f "$private_settings_json"' EXIT
          build_start_epoch="$RUNNER_TEMP/${{ matrix.ios-push-provider }}-build-start-epoch"
          shopt -s nullglob
          workspaces=("$APP_PATH"/ios/*.xcworkspace)
          if [[ "${#workspaces[@]}" -ne 1 ]]; then
            echo "::error::expected one generated workspace, found ${#workspaces[@]}: ${workspaces[*]-}"
            exit 1
          fi
          workspace="${workspaces[0]}"
          scheme="$(basename "$workspace" .xcworkspace)"
          set +e
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -showBuildSettings \
            -json > "$private_settings_json"
          xcodebuild_status="$?"
          set -e
          if [[ "$xcodebuild_status" -ne 0 ]]; then
            # Preserve only the resolver's bounded parse metadata. The private
            # build settings are still removed by the EXIT trap.
            python3 scripts/compatibility/resolve_simulator_app.py \
              --private-settings-json "$private_settings_json" \
              --build-start-epoch "$build_start_epoch" \
              --scheme "$scheme" \
              --sanitized-settings-json "$settings_json" >/dev/null || true
            echo "::error::xcodebuild -showBuildSettings failed with exit code $xcodebuild_status"
            exit "$xcodebuild_status"
          fi
          app_product_path="$(python3 scripts/compatibility/resolve_simulator_app.py \
            --private-settings-json "$private_settings_json" \
            --build-start-epoch "$build_start_epoch" \
            --scheme "$scheme" \
            --sanitized-settings-json "$settings_json")"
          if [[ -z "$app_product_path" || "$app_product_path" == *$'\n'* ]]; then
            echo '::error::resolved app product path must be one non-empty line'
            exit 1
          fi
          echo "APP_PRODUCT_PATH=$app_product_path" >> "$GITHUB_ENV"

      # UIScene hosts must launch, so a failure here fails their job. The legacy
      # host is expected to FAIL; its result is asserted against below rather
      # than left to redden the job: see `.github/IOS-TOOLCHAIN-COMPATIBILITY.md`.
      - name: Install and launch generated app
        id: launch
        continue-on-error: ${{ matrix.expectation == 'uiscene-failure' }}
        uses: customerio/mobile-ci-tools/github-actions/ios/launch-simulator-app/v1@main
        with:
          app-path: ${{ env.APP_PRODUCT_PATH }}
          expected-ios-major: '27'
          survival-seconds: ${{ env.LAUNCH_SURVIVAL_SECONDS }}
          log-path: ${{ runner.temp }}/${{ matrix.ios-push-provider }}-launch.log

      # A permanently-red job trains everyone to ignore it, so a real regression
      # here would go unnoticed. Invert the assertion instead of muting it: the
      # job is GREEN while the known Expo defect holds unchanged, and RED the
      # moment it moves. Gated on the step OUTCOME, not on the action's
      # `failure-reason` output, which a failing composite step does not
      # reliably propagate.
      - name: Assert the known Expo UIScene launch failure
        id: known-failure
        if: matrix.expectation == 'uiscene-failure'
        shell: bash
        env:
          LAUNCH_OUTCOME: ${{ steps.launch.outcome }}
          LAUNCH_LOG: ${{ runner.temp }}/${{ matrix.ios-push-provider }}-launch.log
          EXPECTED_EXPO_MAJOR: '57'
          KNOWN_SIGNATURE: 'UIScene life cycle is required|_UIApplicationEvaluateRuntimeIssueForNoSceneLifecycleAdoption'
        run: |
          set -uo pipefail

          flip_reason=""
          detail=""

          # 1. The launch must still fail.
          if [[ "$LAUNCH_OUTCOME" != "failure" ]]; then
            flip_reason="launch-now-succeeds"
            detail="The SDK $EXPECTED_EXPO_MAJOR app launched and survived (step outcome: $LAUNCH_OUTCOME). Hosts without a UIScene manifest now launch on the iOS 27 SDK — retire this legacy-host gate and expect a launch instead."
          fi

          # 2. It must fail with the KNOWN signature, not some other way.
          if [[ -z "$flip_reason" ]]; then
            if [[ ! -s "$LAUNCH_LOG" ]]; then
              flip_reason="signature-changed"
              detail="The launch failed but produced no readable log at $LAUNCH_LOG, so the failure could not be identified as the known UIScene defect."
            elif ! grep -Eq "$KNOWN_SIGNATURE" "$LAUNCH_LOG"; then
              flip_reason="signature-changed"
              detail="The launch failed for a reason that does not match the known UIScene signature. This is a genuinely new problem, not the tracked Expo defect."
            fi
          fi

          # 3. The assumption this gate encodes — Expo SDK 57 — must still hold.
          resolved_expo="$(node -e 'const fs=require("fs"),p=require("path");try{const j=JSON.parse(fs.readFileSync(p.join(process.env.APP_PATH,"package.json"),"utf8"));process.stdout.write(String((j.dependencies||{}).expo||""))}catch(e){}' 2>/dev/null || true)"
          resolved_major="$(printf '%s' "$resolved_expo" | sed -n 's/^[^0-9]*\([0-9][0-9]*\).*/\1/p')"
          echo "Resolved Expo release in the generated app: ${resolved_expo:-unknown} (major: ${resolved_major:-unknown})"
          # An unreadable probe is NOT evidence that Expo moved. Keep the two
          # apart, or any failure to read package.json reports a stale premise
          # that did not happen and sends someone chasing a non-event.
          if [[ -z "$flip_reason" ]]; then
            if [[ -z "$resolved_major" ]]; then
              flip_reason="expo-version-unresolved"
              detail="Could not read an Expo version from \$APP_PATH/package.json (resolved: '${resolved_expo:-empty}'). The gate could not confirm its own premise of SDK $EXPECTED_EXPO_MAJOR. This is a probe failure to fix here, not a change in Expo."
            elif [[ "$resolved_major" != "$EXPECTED_EXPO_MAJOR" ]]; then
              flip_reason="expo-sdk-moved"
              detail="The legacy-host leg resolved Expo ${resolved_expo:-unknown}, not SDK $EXPECTED_EXPO_MAJOR. This gate's premise is stale — SDK 58+ hosts adopt UIScene and belong on the launch legs, so fix the matrix entry."
            fi
          fi

          {
            echo "flip-reason=$flip_reason"
            echo "launch-outcome=$LAUNCH_OUTCOME"
            echo "resolved-expo=${resolved_expo:-unknown}"
          } >> "$GITHUB_OUTPUT"

          if [[ -n "$flip_reason" ]]; then
            echo "::error title=Xcode 27 preview::[$flip_reason] $detail"
            {
              echo '## Known Expo failure flipped'
              echo
              echo "**Reason:** \`$flip_reason\`"
              echo "**Provider:** ${{ matrix.ios-push-provider }}"
              echo "**Resolved Expo:** ${resolved_expo:-unknown}"
              echo
              echo "$detail"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "The known Expo UIScene launch failure is unchanged (Expo ${resolved_expo:-unknown}, launch outcome: $LAUNCH_OUTCOME)."
          {
            echo '## Known Expo failure unchanged'
            echo
            echo "The generated ${{ matrix.ios-push-provider }} app still fails to launch with the tracked UIScene defect on Expo ${resolved_expo:-unknown}."
            echo 'Green here means the known defect is unchanged — NOT that this host works on iOS 27.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-27-preview-expo-${{ matrix.expo-version }}-${{ matrix.ios-push-provider }}-logs
          path: |
            ${{ runner.temp }}/${{ matrix.ios-push-provider }}-launch.log
            ${{ runner.temp }}/${{ matrix.ios-push-provider }}-build-settings.json
            ${{ runner.temp }}/${{ matrix.ios-push-provider }}-build-start-epoch
          if-no-files-found: error
          retention-days: 7

      # Only the nightly notifies. Pull-request runs of this workflow (it is
      # triggered by changes to itself) stay quiet. A webhook post needs no
      # GITHUB_TOKEN scope, so `permissions: contents: read` above is left as is.
      - name: Notify team when the Xcode 27 nightly changes state
        # Gate on the step that decides each leg, not on failure(): a launch leg
        # gates on its launch, the legacy-host leg on its assertion. A passing
        # launch or gate followed by a failed artifact upload would otherwise
        # alert, reporting a compatibility change that did not happen.
        #
        # Both legs need the same two branches with different cancellation handling:
        #   failure  -- a real result, already established. Alert even if the run
        #               is later cancelled, or a genuine change is lost.
        #   skipped  -- ambiguous. Either the job broke before that step ran
        #               (worth alerting) or concurrency cancelled the run, which
        #               also leaves it skipped (not worth alerting). Only the
        #               `!cancelled()` guard separates those.
        if: >-
          always() && github.event_name == 'schedule'
          && ((matrix.expectation == 'launch'
          && (steps.launch.outcome == 'failure'
          || (!cancelled() && steps.launch.outcome == 'skipped')))
          || (matrix.expectation == 'uiscene-failure'
          && (steps.known-failure.outcome == 'failure'
          || (!cancelled() && steps.known-failure.outcome == 'skipped'))))
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "text": "Xcode 27 preview: Expo ${{ matrix.expo-version }} (${{ matrix.ios-push-provider }}) changed state",
              "username": "Expo compatibility bot",
              "icon_url": "https://logos-download.com/wp-content/uploads/2021/01/Expo_Logo.png",
              "channel": "#mobile-deployments",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Expo* Xcode 27 preview nightly changed state — :mag: *Expo ${{ matrix.expo-version }}, ${{ matrix.ios-push-provider }}* leg"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Flip reason:* `${{ steps.known-failure.outputs.flip-reason || (matrix.expectation == 'launch' && 'launch-leg-failed') || 'job-failed-before-assertion' }}`\n*Launch outcome:* `${{ steps.known-failure.outputs.launch-outcome || steps.launch.outcome || 'unknown' }}`\n*Resolved Expo:* `${{ steps.known-failure.outputs.resolved-expo || matrix.expo-version }}`\n\n• `launch-leg-failed` — a UIScene host (SDK 58+) failed to build, install, launch or survive. Treat as a regression.\n• `launch-now-succeeds` — the SDK 57 host without UIScene now launches on iOS 27. Retire the legacy-host gate.\n• `signature-changed` — the SDK 57 host still fails, but not with the tracked UIScene signature. Treat as a new problem.\n• `expo-sdk-moved` — the legacy-host leg is no longer on SDK 57, so its premise is stale.\n• `expo-version-unresolved` — the gate could not read the app's Expo version. A probe bug in this workflow, not an Expo change.\n• `job-failed-before-assertion` — the legacy-host leg broke earlier than the launch step.\n\n<https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|View the run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
