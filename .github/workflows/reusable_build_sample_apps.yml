name: Reusable build sample apps workflow

on:
  workflow_call:
    inputs:
      use_latest_sdk_version:
        description: "Whether this workflow should build sample apps with latest SDK version or source code"
        type: boolean
        required: false
        default: false
      sdk_version:
        description: "Published SDK version the sample apps should install. The release path passes the version it just published; leave empty to fall back to the newest tag reachable from this commit."
        type: string
        required: false
        default: ""

jobs:
  build-android-app:
    name: Build and publish Android app
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64 }}
      FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_CREDS_B64: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_CREDS_B64 }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Workaround for bug https://github.com/actions/checkout/issues/1471

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Capture Git Context
        shell: bash
        id: git-context
        env:
          SDK_VERSION_INPUT: ${{ inputs.sdk_version }}
          USE_LATEST_SDK_VERSION: ${{ inputs.use_latest_sdk_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "BRANCH_NAME=${{ github.head_ref || github.ref_name }}" >> $GITHUB_ENV
          COMMIT_HASH="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "COMMIT_HASH=${COMMIT_HASH:0:7}" >> $GITHUB_ENV

          # `git describe` answers an ancestry question — "the newest tag
          # reachable from this commit" — and stays the input to
          # `commitsAheadCount` below. Do not repurpose it.
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

          # "Which published SDK do these apps install" is a different question.
          # semantic-release tags a NEW CHILD of the commit this job checks out,
          # and `git describe` only walks ancestors, so on the release path it
          # names the PREVIOUS release. The release caller therefore passes the
          # version it just published.
          if [ -n "$SDK_VERSION_INPUT" ]; then
            SDK_BUILD_VERSION="$SDK_VERSION_INPUT"
            echo "Resolved SDK version from the sdk_version input: $SDK_BUILD_VERSION"
          elif [ "$USE_LATEST_SDK_VERSION" = "true" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            # Falling back silently here is what produced a release build whose
            # app manifest asked for the new SDK while npm installed the old one.
            echo "::error::Release sample-app build received no sdk_version input. Refusing to fall back to the last reachable tag ('${LATEST_TAG:-none}'), which names the previous release on a release commit."
            exit 1
          else
            SDK_BUILD_VERSION="$LATEST_TAG"
            echo "Resolved SDK version from the last reachable tag: ${SDK_BUILD_VERSION:-none}"
          fi
          echo "SDK_BUILD_VERSION=$SDK_BUILD_VERSION" >> $GITHUB_ENV

      # `test-app/android/` is gitignored — generated by `expo prebuild` later in
      # this job — so there is no committed Gradle input to hash. The comment
      # this replaces claimed the opposite of what the key did: the root
      # `package-lock.json` pins the *plugin's* devDependencies and does not move
      # when the test app's dependency graph moves, so four runs shared one cache
      # entry while building three different SDK versions. Key instead on the two
      # things that do change the Gradle graph: the test app's manifest and the
      # SDK version actually being installed. Runs after `Capture Git Context`
      # because it consumes `SDK_BUILD_VERSION`.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-sampleapp-${{ hashFiles('test-app/package.json') }}-${{ env.SDK_BUILD_VERSION }}
          restore-keys: |
            ${{ runner.os }}-gradle-sampleapp-${{ hashFiles('test-app/package.json') }}-
            ${{ runner.os }}-gradle-sampleapp-

      - name: Set Default Firebase Distribution Groups
        shell: bash
        env:
          # Distribution group constants
          ALL_BUILDS_GROUP: all-builds
          FEATURE_BUILDS_GROUP: feature-branch
          NEXT_BUILDS_GROUP: next
          PUBLIC_BUILDS_GROUP: public
          # Input variables
          CURRENT_BRANCH: ${{ github.ref }}
          USE_LATEST_SDK_VERSION: ${{ inputs.use_latest_sdk_version }}
        run: |
          # Initialize with the default distribution group
          distribution_groups=("$ALL_BUILDS_GROUP")

          # Determine current app type and git context
          [[ "$CURRENT_BRANCH" == "refs/heads/feature/"* ]] && distribution_groups+=("$FEATURE_BUILDS_GROUP")
          [[ "$CURRENT_BRANCH" == "refs/heads/main" || "$CURRENT_BRANCH" == "refs/heads/beta" ]] && distribution_groups+=("$NEXT_BUILDS_GROUP")
          [[ "$USE_LATEST_SDK_VERSION" == "true" ]] && distribution_groups+=("$PUBLIC_BUILDS_GROUP")

          # Export the groups as an environment variable
          echo "firebase_distribution_groups=$(IFS=','; echo "${distribution_groups[*]}")" >> $GITHUB_ENV

      - name: Setup local.env file for sample app
        if: ${{ inputs.use_latest_sdk_version == true }}
        run: |
          touch "test-app/local.env"
          echo "sdkVersion=${{ env.SDK_BUILD_VERSION }}" >> "test-app/local.env"

      - name: Install tools from Gemfile (ruby language) used for building our apps with
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install sd CLI to use later in the workflow
        uses: kenji-miyake/setup-sd@08c14e27d65a1c215342ef00c81583ae67f4c5ef # v2.0.0

      - name: Bundle install
        working-directory: test-app
        run: bundle install

      - name: Update test app version # This has to happen before we generate the native app
        uses: maierj/fastlane-action@5a3b971aaa26776459bb26894d6c1a1a84a311a7 # v3.1.0
        with:
          lane: update_expo_test_app_version
          subdirectory: test-app
          options: ${{ inputs.use_latest_sdk_version == true && format('{{"sdk_version":"{0}"}}', env.SDK_BUILD_VERSION) || '' }}

      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci

      - name: Setup CIO workspace credentials in test apps config
        run: |
          APP_JSON_FILE="test-app/app.json"
          sd "\"buildTimestamp\": .*" "\"buildTimestamp\": $(date +%s)," "$APP_JSON_FILE"
          sd "\"cdpApiKey\".*" "\"cdpApiKey\": \"${{ secrets.CUSTOMERIO_EXPO_WORKSPACE_CDP_API_KEY }}\"," "$APP_JSON_FILE"
          sd "\"siteId\".*" "\"siteId\": \"${{ secrets.CUSTOMERIO_EXPO_WORKSPACE_SITE_ID }}\"," "$APP_JSON_FILE"
          sd "\"workspaceName\".*" "\"workspaceName\": \"Mobile: Expo\"," "$APP_JSON_FILE"
          sd "\"branchName\".*" "\"branchName\": \"${{ env.BRANCH_NAME }}\"," "$APP_JSON_FILE"
          sd "\"commitHash\".*" "\"commitHash\": \"${{ env.COMMIT_HASH }}\"," "$APP_JSON_FILE"
          LAST_TAG="${LATEST_TAG:-untagged}"
          COMMITS_AHEAD=$(git rev-list $LAST_TAG..HEAD --count 2>/dev/null || echo "untracked")
          sd "\"commitsAheadCount\".*" "\"commitsAheadCount\": \"$COMMITS_AHEAD\"," "$APP_JSON_FILE"

      - name: Setup test project
        run: npm run setup-test-app

      # `mergeDexRelease` runs D8 in-process in the Gradle daemon, and the daemon
      # is capped at -Xmx2048m by `test-app/android/gradle.properties`. That file
      # is generated by `expo prebuild` and gitignored, so it cannot be edited
      # here; and the plugin's `withGradleProperties` mods ship to customers, so
      # they must not be used to work around a CI-only constraint. Gradle ranks
      # GRADLE_USER_HOME's `gradle.properties` above the project's, which is how
      # customerio-flutter solves the identical constraint. `~/.gradle/caches`
      # and `~/.gradle/wrapper` are the only restored cache paths, so this file
      # is never restored and the append stays clean per run.
      - name: Increase Gradle memory limit
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g" >> ~/.gradle/gradle.properties

      - name: Build Android app with fastlane
        id: android_build
        uses: maierj/fastlane-action@5a3b971aaa26776459bb26894d6c1a1a84a311a7 # v3.1.0
        with:
          lane: android build
          subdirectory: test-app
          options: '{"distribution_groups": "${{ env.firebase_distribution_groups }}"}'
        env:
          FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_CREDS_B64: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_CREDS_B64 }}
          _JAVA_OPTIONS: "-Xmx4g"

      - name: Send Slack Notification for Sample App Builds (Android)
        if: ${{ always() }}
        uses: customerio/mobile-ci-tools/github-actions/slack-notify-sample-app/v1@main
        with:
          build_status: ${{ steps.android_build.outcome }}
          app_icon_emoji: ":expo:"
          app_name: "Expo"
          firebase_app_id: ${{ secrets.SAMPLE_APP_FIREBASE_APP_ID_ANDROID }}
          firebase_distribution_groups: ${{ env.firebase_distribution_groups }}
          git_context: "${{ env.BRANCH_NAME }} (${{ env.COMMIT_HASH }})"
          icon_url: "https://logos-download.com/wp-content/uploads/2021/01/Expo_Logo.png"
          instructions_guide_link: ${{ secrets.SAMPLE_APPS_INSTRUCTIONS_GUIDE_LINK }}
          platform: "android"
          sdk_name: "Expo Plugin"
          sdk_version: ${{ env.SDK_BUILD_VERSION }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  build-ios-app:
    name: Build and publish iOS app
    runs-on: macos-26
    strategy:
      matrix:
        push_provider: [fcm, apn]
    env:
      GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64 }}
      FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_CREDS_B64: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_CREDS_B64 }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Workaround for bug https://github.com/actions/checkout/issues/1471

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'

      - name: Capture Git Context
        shell: bash
        id: git-context
        env:
          SDK_VERSION_INPUT: ${{ inputs.sdk_version }}
          USE_LATEST_SDK_VERSION: ${{ inputs.use_latest_sdk_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "BRANCH_NAME=${{ github.head_ref || github.ref_name }}" >> $GITHUB_ENV
          COMMIT_HASH="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "COMMIT_HASH=${COMMIT_HASH:0:7}" >> $GITHUB_ENV

          # `git describe` answers an ancestry question — "the newest tag
          # reachable from this commit" — and stays the input to
          # `commitsAheadCount` below. Do not repurpose it.
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

          # "Which published SDK do these apps install" is a different question.
          # semantic-release tags a NEW CHILD of the commit this job checks out,
          # and `git describe` only walks ancestors, so on the release path it
          # names the PREVIOUS release. The release caller therefore passes the
          # version it just published.
          if [ -n "$SDK_VERSION_INPUT" ]; then
            SDK_BUILD_VERSION="$SDK_VERSION_INPUT"
            echo "Resolved SDK version from the sdk_version input: $SDK_BUILD_VERSION"
          elif [ "$USE_LATEST_SDK_VERSION" = "true" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            # Falling back silently here is what produced a release build whose
            # app manifest asked for the new SDK while npm installed the old one.
            echo "::error::Release sample-app build received no sdk_version input. Refusing to fall back to the last reachable tag ('${LATEST_TAG:-none}'), which names the previous release on a release commit."
            exit 1
          else
            SDK_BUILD_VERSION="$LATEST_TAG"
            echo "Resolved SDK version from the last reachable tag: ${SDK_BUILD_VERSION:-none}"
          fi
          echo "SDK_BUILD_VERSION=$SDK_BUILD_VERSION" >> $GITHUB_ENV

      - name: Set Default Firebase Distribution Groups
        shell: bash
        env:
          # Distribution group constants
          ALL_BUILDS_GROUP: all-builds
          FEATURE_BUILDS_GROUP: feature-branch
          NEXT_BUILDS_GROUP: next
          PUBLIC_BUILDS_GROUP: public
          # Input variables
          CURRENT_BRANCH: ${{ github.ref }}
          USE_LATEST_SDK_VERSION: ${{ inputs.use_latest_sdk_version }}
        run: |
          # Initialize with the default distribution group
          distribution_groups=("$ALL_BUILDS_GROUP")

          # Determine current app type and git context
          [[ "$CURRENT_BRANCH" == "refs/heads/feature/"* ]] && distribution_groups+=("$FEATURE_BUILDS_GROUP")
          [[ "$CURRENT_BRANCH" == "refs/heads/main" || "$CURRENT_BRANCH" == "refs/heads/beta" ]] && distribution_groups+=("$NEXT_BUILDS_GROUP")
          
          if [[ ${{ matrix.push_provider }} == "apn" && "$USE_LATEST_SDK_VERSION" == "true" ]]; then
            distribution_groups+=("$PUBLIC_BUILDS_GROUP")
          fi

          # Export the groups as an environment variable
          echo "firebase_distribution_groups=$(IFS=','; echo "${distribution_groups[*]}")" >> $GITHUB_ENV

      - name: Setup local.env file for sample app
        shell: bash
        run: |
          touch "test-app/local.env"
          if [ "${{ inputs.use_latest_sdk_version }}" == "true" ]; then
            echo "sdkVersion=${{ env.SDK_BUILD_VERSION }}" >> "test-app/local.env"
          fi
          echo "pushProvider=${{ matrix.push_provider }}" >> "test-app/local.env"

      - name: Setup iOS
        uses: customerio/mobile-ci-tools/github-actions/ios/setup-ios/v1@main
        with:
          xcode-version: "26.5"

      # `test-app/Podfile` and `Podfile.lock` are gitignored — generated by
      # `expo prebuild` later in this job. Key on `package-lock.json` so the
      # cache invalidates when plugin/test-app deps change.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-sampleapp-${{ matrix.push_provider }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-sampleapp-${{ matrix.push_provider }}-

      - name: Install tools from Gemfile (ruby language) used for building our apps with
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install SD CLI
        run: brew install sd

      - name: Bundle install
        working-directory: test-app
        run: bundle install

      - name: Update test app version # This has to happen before we generate the native app
        uses: maierj/fastlane-action@5a3b971aaa26776459bb26894d6c1a1a84a311a7 # v3.1.0
        with:
          lane: update_expo_test_app_version
          subdirectory: test-app
          options: ${{ inputs.use_latest_sdk_version == true && format('{{"sdk_version":"{0}"}}', env.SDK_BUILD_VERSION) || '' }}

      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci

      - name: Setup CIO workspace credentials in test apps config
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_HASH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          APP_JSON_FILE="test-app/app.json"
          sd "\"buildTimestamp\": .*" "\"buildTimestamp\": $(date +%s)," "$APP_JSON_FILE"
          sd "\"workspaceName\".*" "\"workspaceName\": \"Mobile: Expo\"," "$APP_JSON_FILE"
          sd "\"branchName\".*" "\"branchName\": \"${{ env.BRANCH_NAME }}\"," "$APP_JSON_FILE"
          sd "\"commitHash\".*" "\"commitHash\": \"${{ env.COMMIT_HASH }}\"," "$APP_JSON_FILE"
          LAST_TAG="${LATEST_TAG:-untagged}"
          COMMITS_AHEAD=$(git rev-list $LAST_TAG..HEAD --count 2>/dev/null || echo "untracked")
          sd "\"commitsAheadCount\".*" "\"commitsAheadCount\": \"$COMMITS_AHEAD\"," "$APP_JSON_FILE"

          if [ "${{ matrix.push_provider }}" == "fcm" ]; then
            sd "\"cdpApiKey\".*" "\"cdpApiKey\": \"${{ secrets.CUSTOMERIO_RN_FCM_WORKSPACE_CDP_API_KEY }}\"," "$APP_JSON_FILE"
            sd "\"siteId\".*" "\"siteId\": \"${{ secrets.CUSTOMERIO_RN_FCM_WORKSPACE_SITE_ID }}\"," "$APP_JSON_FILE"
          else
            sd "\"cdpApiKey\".*" "\"cdpApiKey\": \"${{ secrets.CUSTOMERIO_EXPO_WORKSPACE_CDP_API_KEY }}\"," "$APP_JSON_FILE"
            sd "\"siteId\".*" "\"siteId\": \"${{ secrets.CUSTOMERIO_EXPO_WORKSPACE_SITE_ID }}\"," "$APP_JSON_FILE"
          fi

      - name: Setup test project
        run: npm run setup-test-app

      - name: Copy GoogleService-Info.plist to ios project
        run: |
          cp test-app/files/GoogleService-Info.plist test-app/ios/GoogleService-Info.plist
          gem install xcodeproj
          ruby scripts/add-google-service-ios.rb

      - name: Build iOS app with fastlane
        id: ios_build
        uses: maierj/fastlane-action@5a3b971aaa26776459bb26894d6c1a1a84a311a7 # v3.1.0
        with:
          lane: ios build_ios
          subdirectory: test-app
          options: '{"distribution_groups": "${{ env.firebase_distribution_groups }}", "push_provider": "${{ matrix.push_provider }}"}'
        env:
          GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64 }}
          FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_CREDS_B64: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_CREDS_B64 }}

      - name: Send Slack Notification for Sample App Builds (Android)
        if: ${{ always() }}
        uses: customerio/mobile-ci-tools/github-actions/slack-notify-sample-app/v1@main
        with:
          build_status: ${{ steps.ios_build.outcome }}
          app_icon_emoji: ":expo:"
          app_name: "Expo"
          firebase_app_id: ${{ secrets.SAMPLE_APP_FIREBASE_APP_ID_IOS }}
          firebase_distribution_groups: ${{ env.firebase_distribution_groups }}
          git_context: "${{ env.BRANCH_NAME }} (${{ env.COMMIT_HASH }})"
          icon_url: "https://logos-download.com/wp-content/uploads/2021/01/Expo_Logo.png"
          instructions_guide_link: ${{ secrets.SAMPLE_APPS_INSTRUCTIONS_GUIDE_LINK }}
          platform: "ios"
          sdk_name: "Expo Plugin"
          sdk_version: ${{ env.SDK_BUILD_VERSION }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
