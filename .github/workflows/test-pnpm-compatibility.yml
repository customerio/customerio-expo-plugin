name: Test pnpm Compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/test-pnpm-compatibility.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'plugin/**'
      - 'scripts/setup-test-app-pnpm.sh'
      - 'scripts/setup-test-app-pnpm-monorepo.sh'
      - 'scripts/create-plugin-tarball.sh'
      - 'scripts/install-plugin-tarball.sh'
      - 'scripts/verify-pnpm-dev-apps.sh'
      - 'scripts/utils.sh'
      - 'test-app-pnpm/**'
      - 'test-app-pnpm-monorepo/**'
      - '__tests__/scripts/**'
      - '__tests__/workflows/**'
  push:
    branches: [main, beta]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-dev-apps:
    name: Build pnpm dev apps (isolated + hoisted) and verify artifacts
    runs-on: ubuntu-latest
    env:
      # Linux has no Xcode; RN's use_react_native! only reads `xcodebuild -version`.
      FAKE_XCODE_VERSION: '26.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '3.3'

      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document

      - name: Linux CocoaPods shims
        run: |
          stubs="$RUNNER_TEMP/stubs"
          mkdir -p "$stubs"
          printf '#!/bin/sh\necho "Xcode %s"\necho "Build version 17A324"\n' "$FAKE_XCODE_VERSION" > "$stubs/xcodebuild"
          printf '#!/bin/sh\ncommand "$@"\n' > "$stubs/command"
          chmod +x "$stubs/xcodebuild" "$stubs/command"
          echo "$stubs" >> "$GITHUB_PATH"

      - name: Install root dependencies
        run: npm ci

      # Phase A — default pnpm (isolated) mode.
      # On Linux the setup scripts run `expo prebuild --no-install`, and
      # prebuild swallows pod install failures anyway, so each app gets a
      # separate strict `pod install` step.
      - name: 'Phase A — set up test-app-pnpm (flat)'
        run: npm run setup-test-app-pnpm

      - name: 'Phase A — pod install (flat)'
        working-directory: test-app-pnpm/ios
        run: |
          set -o pipefail
          if ! pod install 2>&1 | tee "$RUNNER_TEMP/pod-install.log"; then
            if grep -q "multiple dependencies with different sources" "$RUNNER_TEMP/pod-install.log"; then
              echo "::error::pod install failed in test-app-pnpm/ios: pnpm Podfile :path divergence (the same pod resolved from different :path sources)"
            fi
            exit 1
          fi

      - name: 'Phase A — set up test-app-pnpm-monorepo (workspace)'
        run: npm run setup-test-app-pnpm-monorepo

      - name: 'Phase A — pod install (monorepo)'
        working-directory: test-app-pnpm-monorepo/apps/mobile/ios
        run: |
          set -o pipefail
          if ! pod install 2>&1 | tee "$RUNNER_TEMP/pod-install.log"; then
            if grep -q "multiple dependencies with different sources" "$RUNNER_TEMP/pod-install.log"; then
              echo "::error::pod install failed in test-app-pnpm-monorepo/apps/mobile/ios: pnpm Podfile :path divergence (the same pod resolved from different :path sources)"
            fi
            exit 1
          fi

      - name: 'Phase A — verify Podfile :path values and expoVersion attribution'
        run: npm run verify-pnpm-dev-apps

      # Phase B — hoisted mode.
      # Customers who can't wait for a release are advised to add a
      # node-linker=hoisted .npmrc as a workaround. This phase exercises
      # that workaround so a future change can't silently break the path
      # we recommend customers take.
      - name: 'Phase B — wipe monorepo install and write hoisted .npmrc'
        run: |
          set -euo pipefail
          rm -rf \
            test-app-pnpm-monorepo/node_modules \
            test-app-pnpm-monorepo/pnpm-lock.yaml \
            test-app-pnpm-monorepo/apps/*/node_modules \
            test-app-pnpm-monorepo/apps/*/ios \
            test-app-pnpm-monorepo/apps/*/android \
            test-app-pnpm-monorepo/packages/*/node_modules

          cat > test-app-pnpm-monorepo/.npmrc <<'EOF'
          node-linker=hoisted
          shamefully-hoist=true
          public-hoist-pattern[]=*customerio*
          EOF

      - name: 'Phase B — set up test-app-pnpm-monorepo under hoisted mode'
        run: npm run setup-test-app-pnpm-monorepo

      - name: 'Phase B — pod install (monorepo, hoisted)'
        working-directory: test-app-pnpm-monorepo/apps/mobile/ios
        run: |
          set -o pipefail
          if ! pod install 2>&1 | tee "$RUNNER_TEMP/pod-install.log"; then
            if grep -q "multiple dependencies with different sources" "$RUNNER_TEMP/pod-install.log"; then
              echo "::error::pod install failed in test-app-pnpm-monorepo/apps/mobile/ios: pnpm Podfile :path divergence (the same pod resolved from different :path sources)"
            fi
            exit 1
          fi

      - name: 'Phase B — verify Podfile :path values and expoVersion attribution under hoisted mode'
        run: npm run verify-pnpm-dev-apps
