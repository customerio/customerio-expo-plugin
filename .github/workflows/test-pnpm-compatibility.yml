name: Test pnpm Compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/test-pnpm-compatibility.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'plugin/**'
      - 'scripts/setup-test-app-pnpm.sh'
      - 'scripts/setup-test-app-pnpm-monorepo.sh'
      - 'scripts/create-plugin-tarball.sh'
      - 'scripts/install-plugin-tarball.sh'
      - 'scripts/verify-pnpm-dev-apps.sh'
      - 'scripts/utils.sh'
      - 'test-app-pnpm/**'
      - 'test-app-pnpm-monorepo/**'
      - '__tests__/scripts/**'
      - '__tests__/workflows/**'
  push:
    branches: [main, beta]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-dev-apps:
    name: Build pnpm dev apps (isolated + hoisted) and verify artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install root dependencies
        run: npm ci

      # Phase A — default pnpm (isolated) mode.
      # Each setup script runs `expo prebuild --clean`. On this Linux runner
      # the scripts add `--no-install`, so the Podfile is generated but
      # `pod install` is skipped (CocoaPods is macOS-only). The verify step
      # below asserts only on generated text — the Podfile `:path` values and
      # the installed `expoVersion` — neither of which needs pods. The
      # "pods actually resolve" signal (the customer's "multiple dependencies
      # with different sources" failure) is instead exercised by the real iOS
      # build in the Validate Plugin Compatibility workflow.
      - name: 'Phase A — set up test-app-pnpm (flat)'
        run: npm run setup-test-app-pnpm

      - name: 'Phase A — set up test-app-pnpm-monorepo (workspace)'
        run: npm run setup-test-app-pnpm-monorepo

      - name: 'Phase A — verify Podfile :path values and expoVersion attribution'
        run: npm run verify-pnpm-dev-apps

      # Phase B — hoisted mode.
      # Customers who can't wait for a release are advised to add a
      # node-linker=hoisted .npmrc as a workaround. This phase exercises
      # that workaround so a future change can't silently break the path
      # we recommend customers take.
      - name: 'Phase B — wipe monorepo install and write hoisted .npmrc'
        run: |
          set -euo pipefail
          rm -rf \
            test-app-pnpm-monorepo/node_modules \
            test-app-pnpm-monorepo/pnpm-lock.yaml \
            test-app-pnpm-monorepo/apps/*/node_modules \
            test-app-pnpm-monorepo/apps/*/ios \
            test-app-pnpm-monorepo/apps/*/android \
            test-app-pnpm-monorepo/packages/*/node_modules

          cat > test-app-pnpm-monorepo/.npmrc <<'EOF'
          node-linker=hoisted
          shamefully-hoist=true
          public-hoist-pattern[]=*customerio*
          EOF

      - name: 'Phase B — set up test-app-pnpm-monorepo under hoisted mode'
        run: npm run setup-test-app-pnpm-monorepo

      - name: 'Phase B — verify Podfile :path values and expoVersion attribution under hoisted mode'
        run: npm run verify-pnpm-dev-apps
