name: Semantic PR helper

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # to read the PR title
    steps:
    # levibostian/action-conventional-pr-linter has no Node 24 release. The types
    # below are the ones it accepted (conventional-changelog-conventionalcommits'
    # DEFAULT_COMMIT_TYPES), so the same titles pass and fail as before.
    - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          feature
          fix
          perf
          revert
          docs
          style
          chore
          refactor
          test
          build
          ci
