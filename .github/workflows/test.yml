name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-deploy:
    name: Test able to deploy to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run build

      # `npm pack`, not `npm publish --dry-run`. From npm 11 (which node 24 bundles) a dry-run
      # publish also runs the registry-side preflight, so it fails with "cannot publish over the
      # previously published versions" on any branch whose version semantic-release has not bumped
      # yet -- which is every PR. npm 10 skipped that check, which is why node 20 never tripped it.
      # This validates the package's lifecycle scripts and file contents, not the registry
      # handshake -- the deploy workflow remains the actual publish boundary.
      - name: Package test
        run: npm pack --dry-run

  test-plugin-android:
    name: Test unit tests for plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run plugin tests
        run: npm run setup-test-app && npm test -- __tests__/android

  test-plugin-ios:
    name: Test unit tests for plugin
    runs-on: ubuntu-latest
    strategy:
      matrix:
        push_provider: [fcm, apn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup local.env file for sample app
        shell: bash
        run: |
          touch "test-app/local.env"
          echo "pushProvider=${{ matrix.push_provider }}" >> "test-app/local.env"

      - name: Run plugin tests
        run: npm run setup-test-app && npm test -- __tests__/ios/common __tests__/ios/${{ matrix.push_provider }}

  test-utils:
    name: Test utility functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run utils tests
        run: npm test -- __tests__/utils __tests__/scripts __tests__/workflows __tests__/ios/withCIOIos.test.ts __tests__/ios/withCIOIosSwift.test.ts

  test-scenarios:
    name: Test scenario suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scenarios
        run: npm run test:scenarios
