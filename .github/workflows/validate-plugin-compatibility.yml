name: Validate Plugin Compatibility

# Every code PR gets representative latest Android and iOS/APN real builds.
# Compatibility-sensitive paths add the non-duplicated SDK-floor and FCM cells
# in validate-plugin-compatibility-full.yml. Release validation remains separate.
# PR rows build iOS for arm64 only and Android for one ABI to keep PRs fast; the
# release matrix leaves both arguments unset and builds every architecture.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  # Xcode for iOS rows that do not set `xcode-version` (SDK 54-57 hosts).
  XCODE_VERSION: "26.6"
  APP_DIR: ci-test-apps
  APP_NAME_PREFIX: ExpoPluginTestApp

jobs:
  smoke:
    name: Expo latest - ${{ matrix.platform }}${{ matrix.ios-push-provider && format(' ({0})', matrix.ios-push-provider) }}
    runs-on: ${{ matrix.runs-on }}
    # Bounded so a hung job stops early.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runs-on: ubuntu-latest
            android-abis: arm64-v8a
          - platform: ios
            runs-on: xcode-27
            xcode-version: '27.0'
            launch-ios-major: 27
            ios-push-provider: apn
            ios-archs: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup iOS
        if: matrix.platform == 'ios'
        uses: customerio/mobile-ci-tools/github-actions/ios/setup-ios/v1@main
        with:
          xcode-version: ${{ matrix.xcode-version || env.XCODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      - name: Set APP_NAME and APP_PATH
        run: |
          echo "APP_NAME=${{ env.APP_NAME_PREFIX }}_latest" >> "$GITHUB_ENV"
          echo "APP_PATH=${{ env.APP_DIR }}/${{ env.APP_NAME_PREFIX }}_latest" >> "$GITHUB_ENV"

      # The test app is generated fresh by `compatibility:create-test-app`, so
      # `Podfile.lock` / Gradle files don't exist at checkout. The cache keys
      # below pin to the inputs that determine resolved versions: Expo SDK,
      # Xcode, push provider, and the plugin's own lockfile.
      - name: Cache CocoaPods
        if: matrix.platform == 'ios'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-smoke-${{ matrix.ios-push-provider }}-${{ matrix.xcode-version || env.XCODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-smoke-${{ matrix.ios-push-provider }}-${{ matrix.xcode-version || env.XCODE_VERSION }}-
            ${{ runner.os }}-pods-smoke-${{ matrix.ios-push-provider }}-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-smoke-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-smoke-

      - name: Create Test App
        run: |
          npm run compatibility:create-test-app -- \
            --expo-version=latest \
            --app-name=${{ env.APP_NAME }} \
            --dir-name=${{ env.APP_DIR }}

      - name: Setup Test App
        run: |
          npm run compatibility:setup-test-app -- \
            --app-path=${{ env.APP_PATH }}

      - name: Configure Plugin with Default Config
        run: |
          npm run compatibility:configure-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --add-default-config \
            --cio-plugin.ios.pushNotification.apiHost="proxy.example.com/\$&"

      - name: Validate Plugin
        run: |
          date +%s > "$RUNNER_TEMP/build-start-epoch"
          npm run compatibility:validate-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --expo-version=latest \
            --platforms=${{ matrix.platform }}\
            --ios-use-frameworks="static" \
            ${{ matrix.ios-archs && format(' --ios-archs={0}', matrix.ios-archs) }} \
            ${{ matrix.android-abis && format(' --android-abis={0}', matrix.android-abis) }} \
            ${{ matrix.ios-push-provider && format(' --ios-push-providers={0}', matrix.ios-push-provider) }}

      # Expo SDK 58+ generates a UIScene host, built here with the iOS 27 SDK. A
      # build can pass while the app still terminates at launch, so these rows
      # also install and launch it. SDK 54-57 hosts have no UIScene and cannot
      # launch on the iOS 27 SDK; they stay on Xcode 26 (`XCODE_VERSION`).
      - name: Launch generated iOS app
        if: matrix.launch-ios-major
        uses: ./.github/actions/launch-generated-ios-app
        with:
          app-path: ${{ env.APP_PATH }}
          build-start-epoch-file: ${{ runner.temp }}/build-start-epoch
          expected-ios-major: ${{ matrix.launch-ios-major }}
          log-path: ${{ runner.temp }}/launch.log
          settings-json-path: ${{ runner.temp }}/build-settings.json

      - name: Upload launch logs
        if: failure() && matrix.launch-ios-major
        uses: actions/upload-artifact@v7
        with:
          name: launch-logs-expo-latest-${{ matrix.ios-push-provider }}
          path: |
            ${{ runner.temp }}/launch.log
            ${{ runner.temp }}/build-settings.json
          if-no-files-found: ignore
          retention-days: 7
