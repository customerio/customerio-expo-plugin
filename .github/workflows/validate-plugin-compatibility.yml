name: Validate Plugin Compatibility

# Slim 3-cell PR-time smoke matrix at the latest Expo SDK. Catches real-build
# regressions (Gradle / CocoaPods / xcodebuild) that the fast Jest scenario
# suite can't see. The full multi-SDK matrix runs on merges to main via
# `validate-plugin-compatibility-release.yml`, and on demand via
# `validate-plugin-compatibility-manual.yml`.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  APP_DIR: ci-test-apps
  APP_NAME_PREFIX: ExpoPluginTestApp

jobs:
  smoke:
    name: Expo latest - ${{ matrix.platform }}${{ matrix.ios-push-provider && format(' ({0})', matrix.ios-push-provider) }}${{ matrix.toolchain && format(' - {0}', matrix.toolchain) }}
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runs-on: ubuntu-latest
            experimental: false
          - platform: ios
            runs-on: macos-26
            ios-push-provider: apn
            toolchain: Xcode 26.5
            toolchain-key: xcode-26.5
            xcode-version: '26.5'
            xcode-major: '26'
            ios-sdk-major: '26'
            experimental: false
          - platform: ios
            runs-on: macos-26
            ios-push-provider: fcm
            toolchain: Xcode 26.5
            toolchain-key: xcode-26.5
            xcode-version: '26.5'
            xcode-major: '26'
            ios-sdk-major: '26'
            experimental: false
          - platform: ios
            runs-on: xcode-27
            ios-push-provider: apn
            toolchain: Xcode 27 preview
            toolchain-key: xcode-27-preview
            xcode-version: ''
            xcode-major: '27'
            ios-sdk-major: '27'
            experimental: true
          - platform: ios
            runs-on: xcode-27
            ios-push-provider: fcm
            toolchain: Xcode 27 preview
            toolchain-key: xcode-27-preview
            xcode-version: ''
            xcode-major: '27'
            ios-sdk-major: '27'
            experimental: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup iOS
        if: matrix.platform == 'ios'
        uses: customerio/mobile-ci-tools/github-actions/ios/setup-ios/v1@86901f620405b9acdcbee56020f3d4ef38e45650
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Report and verify iOS toolchain family
        if: matrix.platform == 'ios'
        uses: customerio/mobile-ci-tools/github-actions/ios/report-toolchain/v1@1572446a747bfd0aa33226a037617b62ab2e53ab
        with:
          expected-xcode-major: ${{ matrix.xcode-major }}
          expected-ios-sdk-major: ${{ matrix.ios-sdk-major }}

      - name: Install Dependencies
        run: npm ci

      - name: Set APP_NAME and APP_PATH
        run: |
          echo "APP_NAME=${{ env.APP_NAME_PREFIX }}_latest" >> "$GITHUB_ENV"
          echo "APP_PATH=${{ env.APP_DIR }}/${{ env.APP_NAME_PREFIX }}_latest" >> "$GITHUB_ENV"

      # The test app is generated fresh by `compatibility:create-test-app`, so
      # `Podfile.lock` / Gradle files don't exist at checkout. The cache keys
      # below pin to the inputs that determine resolved versions: Expo SDK,
      # Xcode, push provider, and the plugin's own lockfile.
      - name: Cache CocoaPods
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-smoke-${{ matrix.ios-push-provider }}-${{ matrix.toolchain-key }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-smoke-${{ matrix.ios-push-provider }}-${{ matrix.toolchain-key }}-
            ${{ runner.os }}-pods-smoke-${{ matrix.ios-push-provider }}-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-smoke-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-smoke-

      - name: Create Test App
        run: |
          npm run compatibility:create-test-app -- \
            --expo-version=latest \
            --app-name=${{ env.APP_NAME }} \
            --dir-name=${{ env.APP_DIR }}

      - name: Setup Test App
        run: |
          npm run compatibility:setup-test-app -- \
            --app-path=${{ env.APP_PATH }}

      - name: Configure Plugin with Default Config
        run: |
          npm run compatibility:configure-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --add-default-config

      - name: Validate Plugin
        run: |
          npm run compatibility:validate-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --expo-version=latest \
            --platforms=${{ matrix.platform }}\
            --ios-use-frameworks="static" \
            ${{ matrix.ios-push-provider && format(' --ios-push-providers={0}', matrix.ios-push-provider) }}

      - name: Record iOS compatibility result
        if: always() && !cancelled() && matrix.platform == 'ios'
        shell: bash
        run: |
          {
            echo '## Expo iOS compatibility'
            echo
            echo '**Result:** ${{ job.status }}'
            echo '**Provider:** ${{ matrix.ios-push-provider }}'
            echo '**Toolchain family:** Xcode ${{ matrix.xcode-major }} / iOS SDK ${{ matrix.ios-sdk-major }}'
            echo '**Scope:** generated-project compatibility build; no launch, callback, push-delivery, signing, or App Store claim'
          } >> "$GITHUB_STEP_SUMMARY"
