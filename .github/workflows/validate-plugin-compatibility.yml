name: Validate Plugin Compatibility

# A representative Android + iOS/APN smoke matrix catches real-build regressions
# that Jest cannot see. The separate full-lane caller includes the FCM variant.
# The full multi-SDK release matrix still runs on main and on demand.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
    paths-ignore:
      - '**/*.md'
  workflow_call:
    inputs:
      full:
        description: Include both iOS push-provider variants.
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  XCODE_VERSION: "26.5"
  APP_DIR: ci-test-apps
  APP_NAME_PREFIX: ExpoPluginTestApp

jobs:
  release_policy:
    if: >-
      github.event_name == 'pull_request' &&
      inputs.full != true
    uses: ./.github/workflows/reusable-release-policy.yml
    permissions:
      contents: read
    with:
      pr_title: ${{ github.event.pull_request.title }}
      pr_body: ${{ github.event.pull_request.body || '' }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      head_repository: ${{ github.event.pull_request.head.repo.full_name }}
      target_repository: ${{ github.repository }}
      pr_author: ${{ github.event.pull_request.user.login }}
      ci_full: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}

  prepare:
    name: Select compatibility smoke matrix
    needs: release_policy
    if: >-
      always() &&
      (inputs.full == true ||
      github.event_name != 'pull_request' ||
      (needs.release_policy.result == 'success' &&
      github.event.action != 'edited' &&
      github.event.action != 'labeled' &&
      needs.release_policy.outputs.full_validation != 'true'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select representative or full PR matrix
        id: select
        shell: bash
        env:
          FULL_PR: ${{ inputs.full == true }}
        run: |
          if [[ "$FULL_PR" == 'true' ]]; then
            echo 'matrix=[{"platform":"android","runs-on":"ubuntu-latest"},{"platform":"ios","runs-on":"macos-26","ios-push-provider":"fcm"},{"platform":"ios","runs-on":"macos-26","ios-push-provider":"apn"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"platform":"android","runs-on":"ubuntu-latest"},{"platform":"ios","runs-on":"macos-26","ios-push-provider":"apn"}]' >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: Expo latest - ${{ matrix.platform }}${{ matrix.ios-push-provider && format(' ({0})', matrix.ios-push-provider) }}
    needs: prepare
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup iOS
        if: matrix.platform == 'ios'
        uses: customerio/mobile-ci-tools/github-actions/ios/setup-ios/v1@main
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      - name: Set APP_NAME and APP_PATH
        run: |
          echo "APP_NAME=${{ env.APP_NAME_PREFIX }}_latest" >> $GITHUB_ENV
          echo "APP_PATH=${{ env.APP_DIR }}/${{ env.APP_NAME_PREFIX }}_latest" >> $GITHUB_ENV

      # The test app is generated fresh by `compatibility:create-test-app`, so
      # `Podfile.lock` / Gradle files don't exist at checkout. The cache keys
      # below pin to the inputs that determine resolved versions: Expo SDK,
      # Xcode, push provider, and the plugin's own lockfile.
      - name: Cache CocoaPods
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-smoke-${{ matrix.ios-push-provider }}-${{ env.XCODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-smoke-${{ matrix.ios-push-provider }}-${{ env.XCODE_VERSION }}-
            ${{ runner.os }}-pods-smoke-${{ matrix.ios-push-provider }}-

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-smoke-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-smoke-

      - name: Create Test App
        run: |
          npm run compatibility:create-test-app -- \
            --expo-version=latest \
            --app-name=${{ env.APP_NAME }} \
            --dir-name=${{ env.APP_DIR }}

      - name: Setup Test App
        run: |
          npm run compatibility:setup-test-app -- \
            --app-path=${{ env.APP_PATH }}

      - name: Configure Plugin with Default Config
        run: |
          npm run compatibility:configure-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --add-default-config

      - name: Validate Plugin
        run: |
          npm run compatibility:validate-plugin -- \
            --app-path=${{ env.APP_PATH }} \
            --expo-version=latest \
            --platforms=${{ matrix.platform }}\
            --ios-use-frameworks="static" \
            ${{ matrix.ios-push-provider && format(' --ios-push-providers={0}', matrix.ios-push-provider) }}
